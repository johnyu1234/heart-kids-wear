schema: spec-driven

context: |
  Project: Heart Kids Wear (心童裝) — Pre-order e-commerce platform
  Domain: Taiwanese children's clothing business sourcing from UK
  
  Tech stack:
    Frontend: React (Vite), Vanilla CSS
    Backend: Python (FastAPI)
    Database: SQLite (via SQLAlchemy ORM)
    API: OpenAPI/Swagger (auto-generated by FastAPI), GET + POST only (no PUT/DELETE)
    Auth: JWT tokens
    Email: Resend (transactional emails)
  
  Key business logic:
    - Pre-order model (not instant fulfillment)
    - 7-11 store-to-store and post office delivery in Taiwan
    - Virtual bank account transfer (mock initially, PAYMENT_GATEWAY_ENABLED flag)
    - Store credits (永久有效, auto-refund on discontinued items)
    - Loyalty points (reserved feature, 3-month expiry)
    - Overdue payment escalation (4-stage: deadline → grace → final warning → auto-abandon)
    - Order ID format: YYMM + 4-digit sequential (e.g., 26040001)
    - Member ID format: YYMM + 3-digit sequential (e.g., 2604004)
    - Currency: NT$ with comma formatting (NT$1,000)
    - Each product variant (size/color) gets independent SKU
  
  Conventions:
    - Bilingual UI (Chinese primary, English secondary)
    - All API mutations use POST (no PUT/DELETE)
    - Dual-track remarks: customer-facing + admin-only notes
    - All payments logged in database regardless of mock/live mode

rules:
  proposal:
    - Reference the original specification document for requirements
    - Include both Chinese and English descriptions for UI elements
    - Consider 7-11 and post office delivery constraints
  specs:
    - Use Given/When/Then format for scenarios
    - Include currency formatting requirements (NT$X,XXX)
    - Specify both admin and customer-facing behaviors
  design:
    - Include database schema changes with SQLAlchemy model definitions
    - Define API endpoints with request/response schemas
    - Consider overdue payment and store credit automation flows
  tasks:
    - Break into frontend and backend sub-tasks
    - Include database migration tasks
    - Add API endpoint implementation tasks

operations:
  apply:
    guidance:
      - Run backend tests after implementing API endpoints
      - Verify database migrations work with SQLite
      - Check currency formatting displays as NT$X,XXX
  archive:
    guidance:
      - Summarize what was built and tested
      - Note any deferred features or known limitations
