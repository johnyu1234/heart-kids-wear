services:
  - type: web
    name: heart-kids-wear-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        value: sqlite:///./backend/data/heart_kids_wear.db
      - key: PAYMENT_GATEWAY_ENABLED
        value: "false"
      - key: STORE_CREDIT_AUTO_REFUND
        value: "true"
      - key: OVERDUE_TRACKING_ENABLED
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "heart-kids-wear-media"
      - key: R2_PUBLIC_DOMAIN
        sync: false
